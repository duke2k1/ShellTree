name: Build and test
on: [push, pull_request, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: powershell
        run: ./build.ps1 -Test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: SSH password integration tests
        shell: powershell
        run: |
          python -m pip install -r tests/requirements.txt
          ./tests/integration.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ShellTree-Windows
          path: |
            bin/ShellTree.exe
            bin/ShellTree.exe.config
            bin/*.dll
            THIRD-PARTY-NOTICES.md
            ThirdPartyNotices.zip
